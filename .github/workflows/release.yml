name: Release (Windows)

# Baut die App fuer Windows und legt einen GitHub-Release mit Installer und portabler EXE an.
# Ausloeser: ein Tag wie v0.2.0 pushen, oder manuell ueber "Run workflow".
# Die Version kommt aus dem Tag und wird vor dem Build in tauri.conf.json, Cargo.toml,
# Cargo.lock, package.json und package-lock.json geschrieben.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z.B. 0.2.0. Leer: Wert aus tauri.conf.json"
        required: false
        type: string

permissions:
  contents: write # Release anlegen und Dateien hochladen

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Version bestimmen und in die Projektdateien schreiben
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $conf = "src-tauri/tauri.conf.json"
          # Quelle der Version: der gepushte Tag, sonst die Eingabe beim manuellen Start,
          # sonst der Wert aus tauri.conf.json
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION.Trim() -replace '^v', ''
          } else {
            $version = (Get-Content $conf -Raw | ConvertFrom-Json).version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "'$version' ist keine gueltige Version. Erwartet wird z.B. 0.2.0 (Tag v0.2.0)."
            exit 1
          }

          # Ersetzt den ersten Treffer und bricht ab, wenn das Muster fehlt
          function Set-First([string]$Path, [string]$Pattern, [string]$Replacement) {
            $text = [IO.File]::ReadAllText($Path)
            $regex = [regex]::new($Pattern, 'Multiline')
            if (-not $regex.IsMatch($text)) { Write-Error "Versionsfeld in $Path nicht gefunden."; exit 1 }
            [IO.File]::WriteAllText($Path, $regex.Replace($text, $Replacement, 1))
          }

          # Die Aenderungen gelten nur fuer diesen Build und werden nicht ins Repo zurueckgeschrieben
          Set-First $conf '"version"\s*:\s*"[^"]*"' ('"version": "' + $version + '"')
          Set-First "src-tauri/Cargo.toml" '^version\s*=\s*"[^"]*"' ('version = "' + $version + '"')
          if (Test-Path "src-tauri/Cargo.lock") {
            Set-First "src-tauri/Cargo.lock" '(name = "musiccast-analyzer"\r?\nversion = ")[^"]*' ('${1}' + $version)
          }
          # package.json und package-lock.json gemeinsam, damit npm ci sie als konsistent ansieht
          npm version $version --no-git-tag-version --allow-same-version | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "npm version ist fehlgeschlagen."; exit 1 }

          Write-Host "Baue Version $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Rust einrichten (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Frontend-Abhaengigkeiten installieren
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: App bauen und Release anlegen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert die Update-Dateien. Ohne diese Secrets bricht der Build ab,
          # weil tauri.conf.json Updater-Artefakte verlangt.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: MusicCast Analyzer ${{ steps.meta.outputs.tag }}
          releaseBody: |
            Windows-Build (x64).

            - `*-setup.exe`: Installer. Die installierte App aktualisiert sich beim Start selbst.
            - `*_portable.exe`: einzelne Datei ohne Installation, braucht die WebView2-Runtime (bei Windows 10/11 in der Regel vorhanden)
            - `latest.json` und `*.sig`: Daten fuer das automatische Update

            Die Dateien sind nicht signiert. Windows SmartScreen zeigt deshalb beim ersten Start eine Warnung.
          releaseDraft: false
          prerelease: false

      - name: Portable EXE an den Release anhaengen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "src-tauri/target/release/musiccast-analyzer.exe"
          if (-not (Test-Path $exe)) { Write-Error "$exe wurde nicht gebaut."; exit 1 }
          $out = "MusicCast-Analyzer_${{ steps.meta.outputs.version }}_x64_portable.exe"
          Copy-Item $exe $out
          gh release upload "${{ steps.meta.outputs.tag }}" $out --clobber
