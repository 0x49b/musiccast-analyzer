name: Release (Windows)

# Builds the app for Windows and creates a GitHub release with the installer and a portable EXE.
# Triggers: push a tag such as v0.2.0, or start it manually through "Run workflow".
# The version comes from the tag and is written into tauri.conf.json, Cargo.toml, Cargo.lock,
# package.json and package-lock.json before the build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.2.0. Empty: value from tauri.conf.json"
        required: false
        type: string

permissions:
  contents: write # create the release and upload files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Determine version and write it into the project files
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $conf = "src-tauri/tauri.conf.json"
          # Source of the version: the pushed tag, otherwise the input of a manual run,
          # otherwise the value from tauri.conf.json
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION.Trim() -replace '^v', ''
          } else {
            $version = (Get-Content $conf -Raw | ConvertFrom-Json).version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "'$version' is not a valid version. Expected something like 0.2.0 (tag v0.2.0)."
            exit 1
          }

          # Replaces the first match and aborts if the pattern is missing
          function Set-First([string]$Path, [string]$Pattern, [string]$Replacement) {
            $text = [IO.File]::ReadAllText($Path)
            $regex = [regex]::new($Pattern, 'Multiline')
            if (-not $regex.IsMatch($text)) { Write-Error "Version field not found in $Path."; exit 1 }
            [IO.File]::WriteAllText($Path, $regex.Replace($text, $Replacement, 1))
          }

          # The changes apply to this build only and are not written back to the repository
          Set-First $conf '"version"\s*:\s*"[^"]*"' ('"version": "' + $version + '"')
          Set-First "src-tauri/Cargo.toml" '^version\s*=\s*"[^"]*"' ('version = "' + $version + '"')
          if (Test-Path "src-tauri/Cargo.lock") {
            Set-First "src-tauri/Cargo.lock" '(name = "musiccast-analyzer"\r?\nversion = ")[^"]*' ('${1}' + $version)
          }
          # package.json and package-lock.json together, so that npm ci sees them as consistent
          npm version $version --no-git-tag-version --allow-same-version | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "npm version failed."; exit 1 }

          Write-Host "Building version $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Build app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. Without these secrets the build fails,
          # because tauri.conf.json asks for updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: MusicCast Analyzer ${{ steps.meta.outputs.tag }}
          releaseBody: |
            Windows build (x64).

            - `*-setup.exe`: installer. The installed app updates itself on startup.
            - `*_portable.exe`: a single file without installation, needs the WebView2 Runtime (usually present on Windows 10/11)
            - `latest.json` and `*.sig`: data for the automatic update

            The files are not code-signed, so Windows SmartScreen shows a warning on first start.
          releaseDraft: false
          prerelease: false

      - name: Attach portable EXE to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "src-tauri/target/release/musiccast-analyzer.exe"
          if (-not (Test-Path $exe)) { Write-Error "$exe was not built."; exit 1 }
          $out = "MusicCast-Analyzer_${{ steps.meta.outputs.version }}_x64_portable.exe"
          Copy-Item $exe $out
          gh release upload "${{ steps.meta.outputs.tag }}" $out --clobber
