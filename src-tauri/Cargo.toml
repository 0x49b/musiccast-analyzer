[package]
name = "musiccast-analyzer"
version = "0.1.0"
description = "Diagnose, Link und Monitoring fuer Yamaha MusicCast im Heimnetz"
edition = "2021"

[lib]
name = "musiccast_analyzer_lib"
# Nur rlib: staticlib/cdylib braucht es nur fuer Mobile-Builds. Als DLL sprengt die Lib mit der
# GNU-Toolchain das Export-Limit des Linkers ("export ordinal too large").
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ureq 2.x: blockierender HTTP-Client, ohne TLS (die Geraete sprechen nur HTTP)
ureq = { version = "2", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
